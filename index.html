<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sk.dropz | Newport News Streetwear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --accent-color: #c0392b; 
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; overflow-x: hidden; }

        nav { position: sticky; top: 0; z-index: 1000; background: rgba(10, 10, 10, 0.95); border-bottom: 1px solid #222; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 900; font-size: 1.5rem; letter-spacing: -1px; text-transform: lowercase; }
        .logo span { color: var(--accent-color); }
        .nav-links a { color: var(--text-main); text-decoration: none; margin-left: 1.5rem; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; transition: var(--transition); }
        .nav-links a:hover { color: var(--accent-color); }

        .hero { height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 5%; background: linear-gradient(to bottom, rgba(10,10,10,0), rgba(10,10,10,1)), url('https://images.unsplash.com/photo-1552346154-21d32810aba3?auto=format&fit=crop&q=80&w=2070'); background-size: cover; background-position: center; }
        .hero h1 { font-size: clamp(3rem, 10vw, 6rem); font-weight: 900; line-height: 0.9; margin-bottom: 1rem; text-transform: uppercase; }
        .hero p { font-size: 1.2rem; color: var(--text-dim); margin-bottom: 2rem; max-width: 600px; }
        .hero-btns { display: flex; gap: 1rem; }

        .btn { padding: 1rem 2rem; border: none; font-weight: 800; cursor: pointer; text-transform: uppercase; text-decoration: none; transition: var(--transition); }
        .btn-primary { background: var(--accent-color); color: white; }
        .btn-outline { background: transparent; border: 2px solid white; color: white; }

        #shop { padding: 5rem 5%; }
        .filters { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; flex-wrap: wrap; }
        .filter-btn { background: var(--card-bg); border: 1px solid #333; color: var(--text-dim); padding: 0.5rem 1.5rem; border-radius: 20px; cursor: pointer; transition: var(--transition); }
        .filter-btn.active, .filter-btn:hover { border-color: var(--accent-color); color: white; }

        .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        .product-card { background: var(--card-bg); border: 1px solid #222; overflow: hidden; transition: var(--transition); position: relative; }
        .product-card.sold-out { opacity: 0.6; filter: grayscale(0.8); }
        .product-img { width: 100%; aspect-ratio: 1/1; background: #222; object-fit: cover; }
        .product-info { padding: 1.5rem; }
        
        .tag-row { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
        .tag { font-size: 0.7rem; text-transform: uppercase; color: var(--accent-color); font-weight: 700; }
        .size-tag { font-size: 0.7rem; background: #333; padding: 2px 6px; border-radius: 4px; }

        .product-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
        .price { font-size: 1.1rem; color: var(--text-dim); margin-bottom: 1rem; display: block;}

        .buy-btn { display: block; text-align: center; background: white; color: black; text-decoration: none; padding: 0.8rem; font-weight: 800; font-size: 0.8rem; transition: var(--transition); }
        .buy-btn.sold { background: #333; color: #777; pointer-events: none; }
        .buy-btn:hover:not(.sold) { background: var(--accent-color); color: white; }

        #requests { padding: 5rem 5%; background: #0f0f0f; display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; }
        .request-form { display: grid; gap: 1rem; }
        .request-form input { background: #1a1a1a; border: 1px solid #333; padding: 1rem; color: white; width: 100%; }
        .log-container { background: #000; padding: 1.5rem; border-left: 4px solid var(--accent-color); font-family: 'Courier New', monospace; font-size: 0.8rem; height: 300px; overflow-y: auto; }
        .log-entry { margin-bottom: 1rem; color: #00ff41; }

        footer { padding: 3rem 5%; text-align: center; border-top: 1px solid #222; color: var(--text-dim); }
    </style>
</head>
<body>

    <nav>
        <div class="logo">sk<span>.</span>dropz</div>
        <div class="nav-links">
            <a href="#shop">Shop</a>
            <a href="#requests">Requests</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <section class="hero">
        <h1>STREETWEAR<br>ARCHIVE</h1>
        <p>Newport News pressure. Fast shipping, clean packing.</p>
        <div class="hero-btns">
            <a href="#shop" class="btn btn-primary">Browse Shop</a>
            <a href="#requests" class="btn btn-outline">Submit Request</a>
        </div>
    </section>

    <section id="shop">
        <div class="filters">
            <div class="filters">
    <button class="filter-btn active" onclick="filterItems('all')">All</button>
    <button class="filter-btn" onclick="filterItems('tops')">Tops</button>
    <button class="filter-btn" onclick="filterItems('bottoms')">Bottoms</button>
    <button class="filter-btn" onclick="filterItems('shoes')">Kicks</button> <!-- ADD THIS LINE -->
    <button class="filter-btn" onclick="filterItems('sets')">Sets</button>
    <button class="filter-btn" onclick="filterItems('accessories')">Accessories</button>
</div>
            <button class="filter-btn active" onclick="filterItems('all')">All</button>
            <button class="filter-btn" onclick="filterItems('tops')">Tops</button>
            <button class="filter-btn" onclick="filterItems('bottoms')">Bottoms</button>
            <button class="filter-btn" onclick="filterItems('sets')">Sets</button>
            <button class="filter-btn" onclick="filterItems('accessories')">Accessories</button>
        </div>

        <!-- THIS IS NOW EMPTY, THE SCRIPT WILL FILL IT -->
        <div class="shop-grid" id="shopGrid">
            <div class="log-entry" style="grid-column: 1/-1; text-align: center;">Opening the vault...</div>
        </div>
    </section>

    <section id="requests">
        <div class="form-container">
            <h2>SOURCING REQUEST</h2>
            <form class="request-form" id="reqForm">
                <input type="text" id="reqName" placeholder="Full Name" required>
                <input type="text" id="reqIG" placeholder="Instagram Handle" required>
                <input type="text" id="reqItem" placeholder="Item Name" required>
                <input type="text" id="reqSize" placeholder="Size" required>
                <input type="text" id="reqBudget" placeholder="Budget" required>
                <button type="submit" class="btn btn-primary">Submit Request</button>
            </form>
        </div>
        <div class="log-panel">
            <div class="log-container" id="jsonLog">
                <div class="log-entry">// System Ready... Waiting for requests</div>
            </div>
        </div>
    </section>

    <footer>
        <p>sk.dropz — Newport News, VA — Real fits. No cap.</p>
    </footer>

    <script>
        // ==========================================
        // STEP 1: PASTE YOUR CSV LINK BELOW
        // ==========================================
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQW5IfU5vHunb_TAhTfgflH_J0JQPLWBhHgjRFOojZskFTed5g4ivg_I_CFNKN8hzpSRBxIafFFXCU9/pub?gid=1795026135&single=true&output=csv';

        // Load Inventory from Google Sheets
        async function loadInventory() {
            try {
                const response = await fetch(SHEET_URL);
                const data = await response.text();
                const rows = data.split('\n').slice(1); 
                const grid = document.getElementById('shopGrid');
                grid.innerHTML = ''; 

                rows.forEach(row => {
                    const cols = row.split(',');
                    if (cols.length < 6) return;

                    // Updated to match: Name, Category, Size, Color, Price, ImageURL, Status
                    const [name, category, size, color, price, img, status] = cols;
                    const isSold = status && status.toLowerCase().includes('sold');

                    const card = `
                        <div class="product-card ${isSold ? 'sold-out' : ''}" data-category="${category.trim().toLowerCase()}">
                            <img src="${img.trim()}" alt="${name}" class="product-img">
                            <div class="product-info">
                                <div class="tag-row">
                                    <span class="tag">${category.trim()}</span>
                                    <span class="size-tag">SZ: ${size.trim()}</span>
                                </div>
                                <h3 class="product-name">${name.trim()}</h3>
                                <p style="font-size: 0.8rem; color: #777; margin-bottom: 8px;">Color: ${color.trim()}</p>
                                <span class="price">${price.trim()}</span>
                                ${isSold ? 
                                    '<a class="buy-btn sold">OUT OF STOCK</a>' : 
                                    '<a href="https://ig.me/m/sk.dropz" class="buy-btn">DM TO BUY</a>'}
                            </div>
                        </div>
                    `;
                    grid.innerHTML += card;
                });
            } catch (error) {
                console.error("Error loading sheet:", error);
                document.getElementById('shopGrid').innerHTML = '<div class="log-entry">Error connecting to the vault.</div>';
            }
        }

        // Filtering logic
        function filterItems(category) {
            const items = document.querySelectorAll('.product-card');
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            items.forEach(item => {
                if (category === 'all' || item.getAttribute('data-category') === category) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // Request Form Logic
        document.getElementById('reqForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                name: document.getElementById('reqName').value,
                ig: document.getElementById('reqIG').value,
                item: document.getElementById('reqItem').value,
                size: document.getElementById('reqSize').value,
                budget: document.getElementById('reqBudget').value,
                time: new Date().toLocaleTimeString()
            };
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `> REQUEST RECEIVED:<br>${JSON.stringify(data, null, 2)}`;
            document.getElementById('jsonLog').prepend(entry);
            this.reset();
            alert("Sent. DM @sk.dropz to lock it in.");
        });

        // Initialize
        loadInventory();
    </script>
</body>
</html>
